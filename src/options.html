<!DOCTYPE html>
<html>
<head>
    <title>My Test Extension Options</title>
    <link href="options_styles.css" rel="stylesheet">
</head>
<body>

<div id="groupsEditor">
    <h3>Domains Group</h3>
    <input id="groupName" placeholder="Group Name" type="text"/>
    <textarea id="groupDomains" placeholder="Enter domains separated by commas"></textarea>
    <input type="checkbox" id="groupActive">
    <label for="groupActive" class="group-active-label">Active</label>
    <button id="addGroupButton">Add Group</button>
</div>

<div id="groupsList"></div>

<div id="buttonContainer">
    <button id="clearOptionsButton">Remove All</button>
    <button id="useRecommendedButton">Use Recommended</button>
    <button id="exportGroupsButton">Export</button>
    <button id="importGroupsButton">Import</button>
</div>
<input type="file" id="importGroupsInput" style="display:none;" />

<script src="options.js"></script>
</body>
</html>
